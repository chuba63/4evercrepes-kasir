<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f43f5e">
<title>4ever Crepes — Kasir PO</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, sans-serif; }
  input, textarea, select { font-size: 16px; }
  .tab-btn.active { color: #e11d48; border-bottom: 2px solid #f43f5e; background: #fff1f2; }
  .tab-btn { color: #6b7280; border-bottom: 2px solid transparent; }
</style>
</head>
<body class="bg-rose-50 text-gray-800 min-h-screen pb-12">

<header class="bg-gradient-to-r from-rose-500 to-pink-500 text-white px-4 py-3 sticky top-0 z-10 shadow">
  <div class="flex items-center justify-between max-w-md mx-auto">
    <div>
      <h1 class="font-bold text-lg" id="business-name">4ever Crepes</h1>
      <p class="text-xs opacity-90">Kasir PO</p>
    </div>
    <button onclick="showSettings()" class="p-2 hover:bg-white/10 rounded text-xl">⚙️</button>
  </div>
</header>

<nav class="bg-white border-b border-gray-200 sticky top-[60px] z-10">
  <div class="flex max-w-md mx-auto overflow-x-auto">
    <button data-tab="po" class="tab-btn flex-shrink-0 px-3 py-3 text-sm font-medium">📋 PO</button>
    <button data-tab="inbox" class="tab-btn flex-shrink-0 px-3 py-3 text-sm font-medium">📥 Masuk<span id="inbox-badge" class="hidden ml-1 bg-red-500 text-white text-xs font-bold rounded-full px-1.5 py-0.5"></span></button>
    <button data-tab="menu" class="tab-btn flex-shrink-0 px-3 py-3 text-sm font-medium">🍴 Menu</button>
    <button data-tab="customer" class="tab-btn flex-shrink-0 px-3 py-3 text-sm font-medium">👥 Customer</button>
    <button data-tab="history" class="tab-btn flex-shrink-0 px-3 py-3 text-sm font-medium">📁 Riwayat</button>
    <button data-tab="keuangan" class="tab-btn flex-shrink-0 px-3 py-3 text-sm font-medium">💰 Keuangan</button>
  </div>
</nav>

<main id="content" class="px-4 py-4 max-w-md mx-auto"></main>

<div id="modal" class="hidden fixed inset-0 bg-black/50 z-20 flex items-end sm:items-center justify-center sm:p-4">
  <div class="bg-white rounded-t-2xl sm:rounded-2xl w-full max-w-md max-h-[90vh] overflow-y-auto">
    <div id="modal-content"></div>
  </div>
</div>

<!-- Loading overlay (default visible saat first load) -->
<div id="loading-screen" class="fixed inset-0 bg-rose-50 z-50 flex items-center justify-center">
  <div class="text-center">
    <div class="text-5xl mb-3 animate-pulse">🥞</div>
    <p class="text-rose-500 font-semibold">Loading...</p>
  </div>
</div>

<!-- Login/Signup overlay -->
<div id="login-screen" class="hidden fixed inset-0 bg-gradient-to-br from-rose-100 to-pink-100 z-40 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl p-6 shadow-xl w-full max-w-sm">
    <div class="text-center mb-5">
      <div class="text-5xl mb-2">🥞</div>
      <h1 class="text-2xl font-bold text-rose-500">4ever Crepes</h1>
      <p class="text-xs text-gray-500">Kasir PO</p>
    </div>

    <div id="login-form">
      <h2 class="font-semibold text-gray-700 mb-3">Masuk</h2>
      <input id="li-email" type="email" placeholder="Email" autocomplete="email" class="w-full border rounded-lg px-3 py-2 mb-2">
      <input id="li-pass" type="password" placeholder="Password" autocomplete="current-password" class="w-full border rounded-lg px-3 py-2 mb-3">
      <button onclick="doLogin()" class="w-full bg-rose-500 hover:bg-rose-600 text-white py-3 rounded-xl font-semibold mb-2">Masuk</button>
      <button onclick="switchToSignup()" class="w-full text-rose-500 text-sm py-2">Belum punya akun? Daftar</button>
      <button onclick="doForgotPassword()" class="w-full text-gray-400 text-xs py-1">Lupa password?</button>
    </div>

    <div id="signup-form" class="hidden">
      <h2 class="font-semibold text-gray-700 mb-3">Daftar Akun</h2>
      <input id="su-email" type="email" placeholder="Email" autocomplete="email" class="w-full border rounded-lg px-3 py-2 mb-2">
      <input id="su-pass" type="password" placeholder="Password (min 6 karakter)" autocomplete="new-password" class="w-full border rounded-lg px-3 py-2 mb-3">
      <button onclick="doSignup()" class="w-full bg-rose-500 hover:bg-rose-600 text-white py-3 rounded-xl font-semibold mb-2">Daftar</button>
      <button onclick="switchToLogin()" class="w-full text-rose-500 text-sm py-2">Udah punya akun? Masuk</button>
    </div>

    <p id="auth-error" class="hidden text-red-600 text-xs mt-3 text-center bg-red-50 rounded p-2"></p>
    <p id="auth-info" class="hidden text-green-600 text-xs mt-3 text-center bg-green-50 rounded p-2"></p>
  </div>
</div>

<!-- Access Denied overlay -->
<div id="denied-screen" class="hidden fixed inset-0 bg-rose-50 z-40 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl p-6 shadow-xl w-full max-w-sm text-center">
    <div class="text-5xl mb-3">🔒</div>
    <h2 class="font-bold text-lg mb-2">Akses Ditolak</h2>
    <p class="text-sm text-gray-600 mb-3">Akun lo belum diizinkan masuk.</p>
    <p class="text-xs text-gray-500 mb-1">Email:</p>
    <p id="denied-email" class="text-sm font-mono mb-3 break-all"></p>
    <p class="text-xs text-gray-500 mb-1">UID kamu (kasih ke owner buat di-grant access):</p>
    <p id="denied-uid" class="text-xs font-mono bg-gray-100 rounded p-2 mb-3 break-all"></p>
    <button onclick="copyUid()" class="w-full bg-blue-100 text-blue-700 py-2 rounded-lg text-sm font-semibold mb-2">📋 Copy UID</button>
    <button onclick="doLogout()" class="w-full bg-gray-100 py-2 rounded-lg text-sm">Logout</button>
  </div>
</div>

<!-- Connection indicator -->
<div id="conn-indicator" class="hidden fixed bottom-3 right-3 z-30 text-xs px-3 py-1 rounded-full font-semibold shadow"></div>

<script type="module">
// ============== FIREBASE INIT ==============
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  onAuthStateChanged, signOut, sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getDatabase, ref, set, update, onValue, get
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBH9IO8Vg4tXqLdMHnDelwpoliYH0IyG9U",
  authDomain: "evercrepes-kasir.firebaseapp.com",
  databaseURL: "https://evercrepes-kasir-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "evercrepes-kasir",
  storageBucket: "evercrepes-kasir.firebasestorage.app",
  messagingSenderId: "429451939188",
  appId: "1:429451939188:web:b32734e6428966b184f021"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getDatabase(fbApp);

let currentUser = null;
let isAuthorized = false;
let unsubData = null;
let suppressNextSave = false;

// ============== STATE ==============
const STORAGE_KEY = '4ever-crepes-state-v1';
const DEFAULT_TEMPLATE = `Halo Kak {nama}! 🥞

Berikut detail pesanan {po} di *{bisnis}*:

{items}

{rincian}{catatan}

💳 *Pembayaran:*
{pembayaran}

Mohon konfirmasi pembayaran ya kak 🙏
Terima kasih sudah order di {bisnis}! ✨`;

const defaultState = {
  business: {
    name: '4ever Crepes',
    payment: 'BCA 1234567890\na/n [Nama Pemilik]',
    template: DEFAULT_TEMPLATE
  },
  menu: [],
  pos: [],
  customers: [],
  expenses: []
};

let state = loadState();
let activeTab = 'po';
let orderDraft = null;
let editingOrderId = null;
let pendingIGMessage = '';
let selectedPoId = null;
// Inline handler di HTML jalan di window scope (bukan module scope), jadi orderDraft harus di-mirror ke window
window.orderDraft = null;

// Kotak Masuk: pesanan mentah dari Google Docs (dikirim robot Apps Script).
// PENTING: disimpen di node Firebase 'inbox' yang TERPISAH dari 'shop'.
// Alasannya saveState() nulis pake set() ke seluruh 'shop' — kalo inbox ditaro di dalem shop,
// tiap kali app nyimpen, kiriman robot bakal ketimpa & ilang.
let inbox = [];
let pendingInboxId = null; // inbox entry yang lagi diproses jadi order

function loadState() {
  // Cache lokal — biar kalo offline pas reload, data masih ada
  try {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) return mergeWithDefaults(JSON.parse(stored));
  } catch (e) {}
  return JSON.parse(JSON.stringify(defaultState));
}

function mergeWithDefaults(parsed) {
  const merged = Object.assign({}, defaultState, parsed || {});
  merged.business = Object.assign({}, defaultState.business, (parsed && parsed.business) || {});
  if (!merged.business.template) merged.business.template = DEFAULT_TEMPLATE;
  if (!Array.isArray(merged.menu)) merged.menu = objToArray(merged.menu);
  if (!Array.isArray(merged.pos)) merged.pos = objToArray(merged.pos);
  if (!Array.isArray(merged.customers)) merged.customers = objToArray(merged.customers);
  if (!Array.isArray(merged.expenses)) merged.expenses = objToArray(merged.expenses);
  // Ensure orders inside each PO are arrays too
  merged.pos = merged.pos.map(p => ({ ...p, orders: Array.isArray(p.orders) ? p.orders : objToArray(p.orders) }));
  return merged;
}

function saveLocalCache() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

function saveState() {
  saveLocalCache();
  if (!isAuthorized || !currentUser) return;
  // Convert arrays to ID-keyed objects (Firebase RTDB lebih konsisten dgn objects)
  const serialized = stateToFirebase(state);
  set(ref(db, 'shop'), serialized).catch(err => {
    console.error('Firebase save error:', err);
    // Firebase auto-queues offline writes via onDisconnect — ini biasanya cuma error kalo permission denied
  });
}

function arrayToObj(arr) {
  if (!Array.isArray(arr)) return arr || {};
  const out = {};
  arr.forEach(item => {
    if (item && item.id) out[item.id] = item;
  });
  return out;
}
function objToArray(obj) {
  if (!obj) return [];
  if (Array.isArray(obj)) return obj;
  return Object.values(obj);
}

function stateToFirebase(s) {
  return {
    business: s.business,
    menu: arrayToObj(s.menu),
    pos: arrayToObj((s.pos || []).map(p => ({ ...p, orders: arrayToObj(p.orders || []) }))),
    customers: arrayToObj(s.customers),
    expenses: arrayToObj(s.expenses)
  };
}
function firebaseToState(data) {
  if (!data) return JSON.parse(JSON.stringify(defaultState));
  return mergeWithDefaults({
    business: data.business || {},
    menu: objToArray(data.menu),
    pos: objToArray(data.pos).map(p => ({ ...p, orders: objToArray(p.orders) })),
    customers: objToArray(data.customers),
    expenses: objToArray(data.expenses)
  });
}

// ============== HELPERS ==============
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatRp(n) { return 'Rp ' + (Math.round(n) || 0).toLocaleString('id-ID'); }
function formatDate(iso) {
  return new Date(iso).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
}
function normalizePhone(p) {
  let s = String(p || '').replace(/\D/g, '');
  if (s.startsWith('0')) s = '62' + s.slice(1);
  else if (s.startsWith('8')) s = '62' + s;
  else if (s.startsWith('620')) s = '62' + s.slice(3);
  return s;
}
function normalizeIG(s) {
  return String(s || '').trim().replace(/^@+/, '').replace(/[^a-zA-Z0-9._]/g, '').toLowerCase();
}
function copyToClipboard(text) {
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
}

function getActivePos() { return state.pos.filter(p => p.status === 'active'); }
function getSelectedPo() {
  if (!selectedPoId) return null;
  return state.pos.find(p => p.id === selectedPoId && p.status === 'active');
}
function findOrder(id) {
  for (const po of state.pos) {
    const o = (po.orders || []).find(o => o.id === id);
    if (o) return { po, order: o };
  }
  return null;
}
function calcOrderSub(order) {
  return (order.items || []).reduce((s, it) => {
    const m = state.menu.find(m => m.id === it.menuId);
    return s + (m?.price || 0) * (it.qty || 0);
  }, 0);
}
function calcOrderTotal(order) {
  return calcOrderSub(order) + (order.shipping || 0) - (order.discount || 0);
}
// Omzet = pendapatan bersih TANPA ongkir (ongkir cuma "titipan" buat kurir, bukan revenue bisnis)
function calcOrderOmzet(order) {
  return calcOrderSub(order) - (order.discount || 0);
}

// ============== TABS ==============
function setTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  render();
}
document.querySelectorAll('.tab-btn').forEach(b => {
  b.addEventListener('click', () => setTab(b.dataset.tab));
});

// ============== RENDER ==============
function render() {
  document.getElementById('business-name').textContent = state.business.name;
  const c = document.getElementById('content');
  updateInboxBadge();
  if (activeTab === 'po') c.innerHTML = renderPoTab();
  else if (activeTab === 'inbox') c.innerHTML = renderInboxTab();
  else if (activeTab === 'menu') c.innerHTML = renderMenuTab();
  else if (activeTab === 'customer') c.innerHTML = renderCustomerTab();
  else if (activeTab === 'keuangan') c.innerHTML = renderKeuanganTab();
  else c.innerHTML = renderHistoryTab();
}

function renderPoTab() {
  const activePos = getActivePos();
  // Auto-clear selection if PO no longer active
  if (selectedPoId && !activePos.find(p => p.id === selectedPoId)) selectedPoId = null;

  if (selectedPoId) {
    const po = activePos.find(p => p.id === selectedPoId);
    if (po) return renderPoDetail(po);
  }
  return renderPoList(activePos);
}

function renderPoList(activePos) {
  if (activePos.length === 0) {
    return `
      <div class="text-center py-12">
        <div class="text-6xl mb-3">🥞</div>
        <p class="text-gray-500 mb-4">Belum ada PO aktif</p>
        <button onclick="newPo()" class="bg-rose-500 hover:bg-rose-600 text-white px-6 py-3 rounded-full font-semibold shadow">+ Buat PO Baru</button>
      </div>
    `;
  }
  return `
    <button onclick="newPo()" class="w-full bg-rose-500 hover:bg-rose-600 text-white py-3 rounded-xl font-semibold mb-4 shadow">+ Buat PO Baru</button>
    <p class="text-xs text-gray-500 mb-2 px-1">PO Aktif (${activePos.length})</p>
    <div class="space-y-2">${activePos.map(renderActivePoCard).join('')}</div>
  `;
}

function renderActivePoCard(po) {
  const orders = po.orders || [];
  const total = orders.reduce((s, o) => s + calcOrderOmzet(o), 0);
  const unpaid = orders.filter(o => !o.paid).length;
  return `
    <button onclick="openPo('${po.id}')" class="w-full bg-white rounded-xl p-4 shadow text-left hover:bg-rose-50 transition">
      <div class="flex justify-between items-start mb-2">
        <div class="min-w-0 flex-1">
          <h3 class="font-bold text-base truncate">${escapeHtml(po.name)}</h3>
          <p class="text-xs text-gray-500">${formatDate(po.date)}</p>
        </div>
        <span class="text-rose-500 text-xl">›</span>
      </div>
      <div class="grid grid-cols-3 gap-2 text-center">
        <div class="bg-rose-50 rounded p-1.5">
          <p class="text-[10px] text-gray-500 uppercase">Order</p>
          <p class="font-bold text-rose-600">${orders.length}</p>
        </div>
        <div class="bg-rose-50 rounded p-1.5">
          <p class="text-[10px] text-gray-500 uppercase">Total</p>
          <p class="font-bold text-rose-600 text-xs">${formatRp(total)}</p>
        </div>
        <div class="${unpaid > 0 ? 'bg-yellow-50' : 'bg-green-50'} rounded p-1.5">
          <p class="text-[10px] text-gray-500 uppercase">${unpaid > 0 ? 'Belum' : 'Status'}</p>
          <p class="font-bold ${unpaid > 0 ? 'text-yellow-600' : 'text-green-600'} text-xs">${unpaid > 0 ? unpaid + ' org' : '✓ Lunas'}</p>
        </div>
      </div>
    </button>
  `;
}

// Rekap total qty per menu di sebuah PO. Return array {menuId, name, qty} sort by qty desc.
function getPoItemsSummary(po) {
  const tally = new Map(); // menuId -> qty
  for (const o of (po.orders || [])) {
    for (const it of (o.items || [])) {
      if (!it.menuId) continue;
      tally.set(it.menuId, (tally.get(it.menuId) || 0) + (it.qty || 0));
    }
  }
  const result = [];
  for (const [menuId, qty] of tally.entries()) {
    if (qty <= 0) continue;
    const m = state.menu.find(m => m.id === menuId);
    result.push({ menuId, name: m?.name || '[menu dihapus]', qty });
  }
  result.sort((a, b) => b.qty - a.qty);
  return result;
}

function renderPoDetail(po) {
  const orders = po.orders || [];
  const total = orders.reduce((s, o) => s + calcOrderOmzet(o), 0);
  const paidTotal = orders.filter(o => o.paid).reduce((s, o) => s + calcOrderOmzet(o), 0);
  const unpaid = orders.filter(o => !o.paid).length;
  const itemsSummary = getPoItemsSummary(po);
  const totalItems = itemsSummary.reduce((s, x) => s + x.qty, 0);

  return `
    <button onclick="backToPoList()" class="text-sm text-rose-600 mb-3 inline-flex items-center gap-1 font-semibold">← Daftar PO</button>

    <div class="bg-white rounded-2xl p-4 shadow mb-4">
      <div class="flex justify-between items-start mb-3">
        <div>
          <h2 class="font-bold text-lg">${escapeHtml(po.name)}</h2>
          <p class="text-xs text-gray-500">${formatDate(po.date)}</p>
        </div>
        <div class="flex gap-1">
          <button onclick="editPo('${po.id}')" class="text-xs bg-gray-100 px-3 py-1 rounded-full">✏️</button>
          <button onclick="closePo('${po.id}')" class="text-xs bg-rose-100 text-rose-600 px-3 py-1 rounded-full">Tutup PO</button>
        </div>
      </div>
      <div class="grid grid-cols-3 gap-2">
        <div class="bg-rose-50 rounded-lg p-2 text-center">
          <p class="text-[10px] text-gray-500 uppercase">Order</p>
          <p class="font-bold text-rose-600">${orders.length}</p>
        </div>
        <div class="bg-rose-50 rounded-lg p-2 text-center">
          <p class="text-[10px] text-gray-500 uppercase">Total</p>
          <p class="font-bold text-rose-600 text-sm">${formatRp(total)}</p>
        </div>
        <div class="bg-green-50 rounded-lg p-2 text-center">
          <p class="text-[10px] text-gray-500 uppercase">Lunas</p>
          <p class="font-bold text-green-600 text-sm">${formatRp(paidTotal)}</p>
        </div>
      </div>
      ${unpaid > 0 ? `<p class="text-xs text-yellow-700 mt-2 text-center">⚠️ ${unpaid} pesanan belum bayar</p>` : ''}
    </div>

    ${itemsSummary.length > 0 ? `
      <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4 mb-4">
        <div class="flex justify-between items-baseline mb-2">
          <h3 class="font-semibold text-sm text-amber-900">📊 Total Pesanan</h3>
          <span class="text-xs text-amber-700">${totalItems} item total</span>
        </div>
        <div class="space-y-1">
          ${itemsSummary.map(it => `
            <div class="flex justify-between items-center text-sm">
              <span class="text-gray-700">• ${escapeHtml(it.name)}</span>
              <span class="font-bold text-amber-700 bg-white px-2 py-0.5 rounded-full text-xs min-w-[2rem] text-center">${it.qty}×</span>
            </div>
          `).join('')}
        </div>
      </div>
    ` : ''}

    <button onclick="newOrder()" class="w-full bg-rose-500 hover:bg-rose-600 text-white py-3 rounded-xl font-semibold mb-4 shadow">+ Tambah Pesanan</button>

    ${orders.length === 0 ? '<p class="text-center text-gray-400 py-6 text-sm">Belum ada pesanan</p>' :
      `<div class="space-y-2">${orders.map(renderOrderCard).join('')}</div>`}
  `;
}

function openPo(id) {
  selectedPoId = id;
  window.scrollTo(0, 0);
  render();
}

function backToPoList() {
  selectedPoId = null;
  window.scrollTo(0, 0);
  render();
}

function renderOrderCard(order) {
  const sub = calcOrderSub(order);
  const total = calcOrderTotal(order);
  const itemsList = (order.items || []).map(it => {
    const m = state.menu.find(m => m.id === it.menuId);
    return `<li>${it.qty}× ${escapeHtml(m?.name || '[menu dihapus]')}</li>`;
  }).join('');

  const hasWA = !!(order.customerWA || '').trim();
  const hasIG = !!(order.customerIG || '').trim();
  const sendBtns = [];
  if (hasWA) sendBtns.push(`<button onclick="sendWA('${order.id}')" class="bg-green-500 hover:bg-green-600 text-white py-2 rounded-lg text-sm font-semibold">📱 Kirim WA</button>`);
  if (hasIG) sendBtns.push(`<button onclick="sendIG('${order.id}')" class="bg-pink-500 hover:bg-pink-600 text-white py-2 rounded-lg text-sm font-semibold">📷 Kirim IG</button>`);
  const sendRow = sendBtns.length === 0
    ? '<p class="text-xs text-yellow-600 italic mt-3">⚠️ Belum ada kontak</p>'
    : `<div class="grid ${sendBtns.length === 2 ? 'grid-cols-2' : 'grid-cols-1'} gap-2 mt-3">${sendBtns.join('')}</div>`;

  return `

      <div class="flex justify-between items-start mb-2">
        <div class="min-w-0 flex-1">

        </div>
        <span class="text-[10px] ${order.paid ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'} px-2 py-1 rounded-full font-semibold whitespace-nowrap ml-2">
          ${order.paid ? '✓ LUNAS' : 'BELUM BAYAR'}
        </span>
      </div>
      <ul class="text-xs text-gray-600 ml-4 list-disc mb-2 mt-2">${itemsList}</ul>
      <div class="text-xs text-gray-500 space-y-0.5 mb-2">
        <div class="flex justify-between"><span>Subtotal</span><span>${formatRp(sub)}</span></div>
        ${order.shipping > 0 ? `<div class="flex justify-between"><span>Ongkir</span><span>${formatRp(order.shipping)}</span></div>` : ''}
        ${order.discount > 0 ? `<div class="flex justify-between text-green-600"><span>Diskon</span><span>-${formatRp(order.discount)}</span></div>` : ''}
        <div class="flex justify-between font-bold text-rose-600 text-sm pt-1 border-t"><span>Total</span><span>${formatRp(total)}</span></div>
      </div>
      ${order.notes ? `<p class="text-xs italic text-gray-500 mb-2">📝 ${escapeHtml(order.notes)}</p>` : ''}
      ${sendRow}
      <div class="grid grid-cols-3 gap-2 mt-2">
        <button onclick="togglePaid('${order.id}')" class="bg-gray-100 py-2 rounded-lg text-xs">${order.paid ? '↩️ Batal Lunas' : '✓ Tandai Lunas'}</button>
        <button onclick="editOrder('${order.id}')" class="bg-gray-100 py-2 rounded-lg text-xs">✏️ Edit</button>
        <button onclick="deleteOrder('${order.id}')" class="bg-red-50 text-red-600 py-2 rounded-lg text-xs">🗑️ Hapus</button>
      </div>
    </div>
  `;
}

function renderMenuTab() {
  return `
    <button onclick="newMenu()" class="w-full bg-rose-500 hover:bg-rose-600 text-white py-3 rounded-xl font-semibold mb-4 shadow">+ Tambah Menu</button>
    ${state.menu.length === 0 ? `
      <div class="text-center py-8">
        <div class="text-5xl mb-2">🍴</div>

        ${state.menu.map(m => `
          <div class="bg-white rounded-xl p-4 shadow flex justify-between items-center">

              <h3 class="font-semibold truncate">${escapeHtml(m.name)}</h3>
              <p class="text-rose-600 font-bold text-sm">${formatRp(m.price)}</p>
            </div>

function renderHistoryTab() {
  const closed = state.pos.filter(p => p.status === 'closed').sort((a, b) => new Date(b.date) - new Date(a.date));
  if (closed.length === 0) {
    return `
      <div class="text-center py-8">
        <div class="text-5xl mb-2">📁</div>
        <p class="text-gray-500 text-sm">Belum ada PO yang ditutup</p>
      </div>
    `;
  }
  const grandTotal = closed.reduce((s, p) => s + (p.orders || []).reduce((ss, o) => ss + calcOrderOmzet(o), 0), 0);
  return `
    <div class="bg-rose-100 rounded-xl p-3 mb-4 text-center">
      <p class="text-xs text-gray-600">Total dari ${closed.length} PO selesai</p>
      <p class="font-bold text-rose-700 text-lg">${formatRp(grandTotal)}</p>
    </div>
    <div class="space-y-2">
      ${closed.map(p => {
        const orders = p.orders || [];
        const total = orders.reduce((s, o) => s + calcOrderOmzet(o), 0);
        return `
          <button onclick="viewPo('${p.id}')" class="w-full bg-white rounded-xl p-4 shadow text-left">
            <div class="flex justify-between items-start">
              <div>
                <h3 class="font-semibold">${escapeHtml(p.name)}</h3>
                <p class="text-xs text-gray-500">${formatDate(p.date)}</p>
              </div>
              <div class="text-right">
                <p class="text-xs text-gray-500">${orders.length} order</p>
                <p class="font-bold text-rose-600">${formatRp(total)}</p>
              </div>
            </div>
          </button>
        `;
      }).join('')}
    </div>
  `;
}

function showModal(html) {

  document.getElementById('modal').classList.remove('hidden');
}
function closeModal() {
  document.getElementById('modal').classList.add('hidden');
  document.getElementById('modal-content').innerHTML = '';

}
document.getElementById('modal').addEventListener('click', (e) => {

// ============== PO CRUD ==============
function newPo() {
  const today = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long' });
  showModal(`
    <div class="p-4">
      <h2 class="font-bold text-lg mb-4">Buat PO Baru</h2>
      <label class="block text-sm font-medium mb-1">Nama PO</label>
      <input id="po-name" class="w-full border rounded-lg px-3 py-2 mb-4" value="PO ${today}" placeholder="PO 6 Mei">
      <div class="flex gap-2">
        <button onclick="closeModal()" class="flex-1 bg-gray-100 py-3 rounded-xl">Batal</button>
        <button onclick="savePo()" class="flex-1 bg-rose-500 text-white py-3 rounded-xl font-semibold">Simpan</button>
      </div>
    </div>
  `);
  setTimeout(() => document.getElementById('po-name')?.focus(), 100);
}

function savePo() {
  const name = document.getElementById('po-name').value.trim();
  if (!name) { alert('Nama PO wajib'); return; }
  const newId = uid();
  state.pos.unshift({
    id: newId, name, date: new Date().toISOString(), status: 'active', orders: []
  });
  selectedPoId = newId; // langsung buka PO yang baru dibuat
  saveState(); closeModal(); render();
}

function editPo(id) {
  const po = state.pos.find(p => p.id === id);
  if (!po) return;
  showModal(`
    <div class="p-4">
      <h2 class="font-bold text-lg mb-4">Edit PO</h2>
      <label class="block text-sm font-medium mb-1">Nama PO</label>
      <input id="po-name-edit" class="w-full border rounded-lg px-3 py-2 mb-4" value="${escapeHtml(po.name)}">
      <div class="flex gap-2">
        <button onclick="closeModal()" class="flex-1 bg-gray-100 py-3 rounded-xl">Batal</button>
        <button onclick="savePoEdit('${id}')" class="flex-1 bg-rose-500 text-white py-3 rounded-xl font-semibold">Simpan</button>
      </div>
    </div>
  `);
}

function savePoEdit(id) {
  const name = document.getElementById('po-name-edit').value.trim();
  if (!name) { alert('Nama PO wajib'); return; }
  const po = state.pos.find(p => p.id === id);
  if (po) { po.name = name; saveState(); closeModal(); render(); }
}

function closePo(id) {
  const po = state.pos.find(p => p.id === id);
  if (!po) return;
  const unpaid = (po.orders || []).filter(o => !o.paid).length;
  let msg = 'Tutup PO ini? Akan dipindah ke Riwayat.';
  if (unpaid > 0) msg = `Masih ada ${unpaid} pesanan belum bayar. Yakin tutup PO?`;
  if (!confirm(msg)) return;
  po.status = 'closed';
  if (selectedPoId === id) selectedPoId = null;
  saveState(); render();
}

function viewPo(id) {
  const po = state.pos.find(p => p.id === id);
  if (!po) return;
  const orders = po.orders || [];
  const total = orders.reduce((s, o) => s + calcOrderOmzet(o), 0);
  const paid = orders.filter(o => o.paid).length;
  showModal(`
    <div class="p-4">
      <h2 class="font-bold text-lg">${escapeHtml(po.name)}</h2>
      <p class="text-xs text-gray-500 mb-3">${formatDate(po.date)}</p>
      <div class="bg-rose-50 rounded-lg p-3 mb-3 text-sm">
        <div class="flex justify-between"><span>Total order</span><strong>${orders.length}</strong></div>
        <div class="flex justify-between"><span>Lunas / Belum</span><strong>${paid} / ${orders.length - paid}</strong></div>
        <div class="flex justify-between text-rose-600 font-bold pt-1 border-t mt-1"><span>Total Pendapatan</span><span>${formatRp(total)}</span></div>
      </div>
      <div class="space-y-2 mb-4 max-h-72 overflow-y-auto">
        ${orders.map(o => {
          const items = (o.items || []).map(it => {
            const m = state.menu.find(m => m.id === it.menuId);
            return `${it.qty}× ${escapeHtml(m?.name || '?')}`;
          }).join(', ');
          const contact = [
            o.customerWA ? `📱 ${escapeHtml(o.customerWA)}` : '',
            o.customerIG ? `📷 @${escapeHtml(normalizeIG(o.customerIG))}` : ''
          ].filter(Boolean).join(' · ');
          return `
            <div class="border rounded-lg p-2">
              <div class="flex justify-between items-start">
                <span class="font-semibold text-sm">${o.customerName ? escapeHtml(o.customerName) : '<span class="text-gray-400 italic font-normal">Tanpa nama</span>'}</span>
                <span class="text-[10px] ${o.paid ? 'text-green-600' : 'text-yellow-600'} font-semibold">${o.paid ? '✓ LUNAS' : 'BELUM'}</span>
              </div>
              ${contact ? `<p class="text-[10px] text-gray-400">${contact}</p>` : ''}
              <p class="text-xs text-gray-500">${items}</p>
              <p class="text-sm font-bold text-rose-600">${formatRp(calcOrderOmzet(o))}</p>
            </div>
          `;
        }).join('') || '<p class="text-sm text-gray-500 italic">Tidak ada pesanan</p>'}
      </div>
      <div class="flex gap-2">
        <button onclick="reopenPo('${id}')" class="flex-1 bg-blue-100 text-blue-700 py-2 rounded-lg text-sm font-semibold">Buka Lagi</button>
        <button onclick="deletePo('${id}')" class="flex-1 bg-red-100 text-red-600 py-2 rounded-lg text-sm font-semibold">Hapus</button>
        <button onclick="closeModal()" class="flex-1 bg-gray-100 py-2 rounded-lg">Tutup</button>
      </div>
    </div>
  `);
}

function reopenPo(id) {
  const po = state.pos.find(p => p.id === id);
  if (po) {
    po.status = 'active';
    selectedPoId = id; // langsung buka PO yang baru dibuka lagi
    saveState(); closeModal(); setTab('po');
  }
}

function deletePo(id) {
  if (!confirm('Hapus PO ini permanen? Tidak bisa di-undo.')) return;
  state.pos = state.pos.filter(p => p.id !== id);
  saveState(); closeModal(); render();
}

// ============== MENU CRUD ==============
function newMenu() {
  showModal(menuFormHtml());
  setTimeout(() => document.getElementById('m-name')?.focus(), 100);
}
function editMenu(id) {
  const m = state.menu.find(x => x.id === id);
  if (m) showModal(menuFormHtml(m));
}
function menuFormHtml(m) {
  const editing = !!m;
  return `
    <div class="p-4">
      <h2 class="font-bold text-lg mb-4">${editing ? 'Edit' : 'Tambah'} Menu</h2>
      <label class="block text-sm font-medium mb-1">Nama Menu</label>
      <input id="m-name" class="w-full border rounded-lg px-3 py-2 mb-3" value="${escapeHtml(m?.name || '')}" placeholder="Crepes Coklat Keju">
      <label class="block text-sm font-medium mb-1">Harga (Rp)</label>
      <input id="m-price" type="number" inputmode="numeric" min="0" class="w-full border rounded-lg px-3 py-2 mb-4" value="${m?.price || ''}" placeholder="15000">
      <div class="flex gap-2">
        <button onclick="closeModal()" class="flex-1 bg-gray-100 py-3 rounded-xl">Batal</button>
        <button onclick="saveMenu('${m?.id || ''}')" class="flex-1 bg-rose-500 text-white py-3 rounded-xl font-semibold">Simpan</button>
      </div>
    </div>
  `;
}
function saveMenu(id) {
  const name = document.getElementById('m-name').value.trim();
  const price = parseInt(document.getElementById('m-price').value) || 0;
  if (!name) { alert('Nama menu wajib'); return; }
  if (price <= 0) { alert('Harga harus > 0'); return; }
  if (id) {
    const m = state.menu.find(x => x.id === id);
    if (m) { m.name = name; m.price = price; }
  } else {
    state.menu.push({ id: uid(), name, price });
  }
  saveState(); closeModal(); render();
}
function deleteMenu(id) {
  if (!confirm('Hapus menu ini? Pesanan lama yang pakai menu ini akan menampilkan "[menu dihapus]".')) return;
  state.menu = state.menu.filter(m => m.id !== id);
  saveState(); render();
}

          <div id="wa-suggestions" class="hidden absolute top-full left-0 right-0 bg-white border rounded-lg shadow-lg z-30 mt-1 max-h-48 overflow-y-auto"></div>
        </div>
      </div>

        <span class="text-xs text-gray-500 w-12 shrink-0 text-center">📷 IG</span>
        <div class="relative flex-1 min-w-0">
          <input id="o-ig" autocomplete="off" class="w-full border rounded-lg px-3 py-2" value="${escapeHtml(orderDraft.customerIG || '')}" oninput="onOrderIGInput(this.value)" onfocus="onOrderIGInput(this.value)" onblur="hideIGSuggestions()" placeholder="@username">
          <div id="ig-suggestions" class="hidden absolute top-full left-0 right-0 bg-white border rounded-lg shadow-lg z-30 mt-1 max-h-48 overflow-y-auto"></div>
        </div>
      </div>

      <label class="block text-sm font-medium mb-1">Pesanan *</label>

      <label class="flex items-center gap-2 mb-3 text-sm">
        <input type="checkbox" id="o-paid" ${orderDraft.paid ? 'checked' : ''} onchange="orderDraft.paid=this.checked" class="w-4 h-4">

function renderDraftItems() {
  const el = document.getElementById('items-list');
  if (!el) return;
  if (orderDraft.items.length === 0) {
    el.innerHTML = '<p class="text-xs text-gray-400 italic text-center py-2">Belum ada item</p>';
    return;
  }
  el.innerHTML = orderDraft.items.map((it, idx) => {
    const m = state.menu.find(mm => mm.id === it.menuId);
    const display = m ? `${m.name} — ${formatRp(m.price)}` : '';
    return `
      <div class="flex gap-2 items-center bg-rose-50 rounded-lg p-2">
        <div class="flex-1 relative">
          <input id="menu-input-${idx}" autocomplete="off" value="${escapeHtml(display)}" placeholder="Ketik nama menu..."
            onfocus="onMenuFocus(${idx})" oninput="onMenuSearch(${idx}, this.value)" onblur="hideMenuSuggestions(${idx})"
            class="w-full border rounded px-2 py-1 bg-white text-sm">
          <div id="menu-suggestions-${idx}" class="hidden absolute top-full left-0 right-0 bg-white border rounded-lg shadow-lg z-30 mt-1 max-h-56 overflow-y-auto"></div>
        </div>
        <input type="number" inputmode="numeric" min="1" value="${it.qty}" oninput="orderDraft.items[${idx}].qty=Math.max(1, parseInt(this.value)||1); updateDraftTotal()" class="w-14 border rounded px-2 py-1 text-center bg-white">
        <button onclick="removeDraftItem(${idx})" class="text-red-500 px-2 text-lg" title="Hapus item">✕</button>
      </div>
    `;
  }).join('');
}

// Daftar saran menu (dropdown yang bisa dicari). q kosong = tampilin semua menu.
function renderMenuSuggestions(idx, q) {
  const dropdown = document.getElementById(`menu-suggestions-${idx}`);
  if (!dropdown) return;
  const query = (q || '').toLowerCase().trim();
  const matches = query ? state.menu.filter(m => m.name.toLowerCase().includes(query)) : state.menu;
  if (matches.length === 0) {
    dropdown.innerHTML = '<div class="px-3 py-2 text-xs text-gray-400 italic">Menu ga ketemu</div>';
    dropdown.classList.remove('hidden');
    return;
  }
  const selId = orderDraft.items[idx]?.menuId;
  dropdown.innerHTML = matches.map(m => `
    <button type="button" onmousedown="event.preventDefault()" onclick="pickMenu(${idx}, '${m.id}')" class="w-full text-left px-3 py-2 hover:bg-rose-50 border-b last:border-b-0 flex justify-between items-center gap-2">
      <span class="text-sm ${m.id === selId ? 'font-semibold text-rose-500' : ''}">${escapeHtml(m.name)}</span>
      <span class="text-xs text-gray-500 whitespace-nowrap">${formatRp(m.price)}</span>
    </button>
  `).join('');
  dropdown.classList.remove('hidden');
}

// Pas kotak menu diklik: select semua teks (biar langsung ketimpa kalo ngetik) + tampilin semua menu
function onMenuFocus(idx) {
  document.getElementById(`menu-input-${idx}`)?.select();
  renderMenuSuggestions(idx, '');
}

// Pas ngetik: filter menu sesuai ketikan
function onMenuSearch(idx, val) { renderMenuSuggestions(idx, val); }

// Pas milih menu dari daftar
function pickMenu(idx, menuId) {
  orderDraft.items[idx].menuId = menuId;
  const m = state.menu.find(mm => mm.id === menuId);
  const inp = document.getElementById(`menu-input-${idx}`);
  if (inp && m) inp.value = `${m.name} — ${formatRp(m.price)}`;
  document.getElementById(`menu-suggestions-${idx}`)?.classList.add('hidden');
  updateDraftTotal();
}

// Pas kotak menu ditinggal (blur): tutup daftar + balikin teks ke menu yang beneran kepilih
// (kalo user ngetik ngasal tapi ga milih apa-apa, teksnya ga nyangkut salah)
function hideMenuSuggestions(idx) {
  setTimeout(() => {
    document.getElementById(`menu-suggestions-${idx}`)?.classList.add('hidden');
    const inp = document.getElementById(`menu-input-${idx}`);
    const m = state.menu.find(mm => mm.id === orderDraft.items[idx]?.menuId);
    if (inp && m) inp.value = `${m.name} — ${formatRp(m.price)}`;
  }, 200);
}

function addDraftItem() {
  if (state.menu.length === 0) return;
  orderDraft.items.push({ menuId: state.menu[0].id, qty: 1 });
  renderDraftItems();
  updateDraftTotal();
}

function removeDraftItem(idx) {
  orderDraft.items.splice(idx, 1);
  renderDraftItems();
  updateDraftTotal();
}

function updateDraftTotal() {
  const sub = calcOrderSub(orderDraft);
  const ship = orderDraft.shipping || 0;
  const disc = orderDraft.discount || 0;
  const total = sub + ship - disc;
  const $ = id => document.getElementById(id);
  if ($('d-sub')) $('d-sub').textContent = formatRp(sub);
  if ($('d-ship')) $('d-ship').textContent = formatRp(ship);
  if ($('d-disc')) $('d-disc').textContent = '-' + formatRp(disc);
  if ($('d-total')) $('d-total').textContent = formatRp(total);
}

function saveOrder() {
  if (!(orderDraft.customerWA || '').trim() && !(orderDraft.customerIG || '').trim()) {
    alert('Isi minimal salah satu kontak (WA atau IG)'); return;
  }
  if (orderDraft.items.length === 0) { alert('Minimal 1 item'); return; }
  const po = getSelectedPo();
  if (!po) { alert('Pilih dulu PO-nya, atau buat PO baru'); return; }
  if (editingOrderId) {
    const idx = po.orders.findIndex(o => o.id === editingOrderId);
    if (idx >= 0) po.orders[idx] = orderDraft;
  } else {
    po.orders.push(orderDraft);
  }
  autoSaveCustomer(orderDraft);
  // Kalau order ini asalnya dari Kotak Masuk, entry-nya dibuang setelah beneran kesimpen
  if (pendingInboxId) { removeInboxEntry(pendingInboxId); pendingInboxId = null; }
  saveState(); closeModal(); render();
}

function autoSaveCustomer(order) {
  const name = (order.customerName || '').trim();
  const wa = (order.customerWA || '').trim();
  const ig = normalizeIG(order.customerIG || '');
  // Skip kalau WA & IG dua-duanya kosong (ga ada kontak buat di-save)
  if (!wa && !ig) return;
  const now = new Date().toISOString();
  // Dedup: match by WA atau IG (mana yang ada)
  const existing = state.customers.find(c => {
    const cWA = (c.wa || '').trim();
    const cIG = normalizeIG(c.ig || '');
    if (wa && cWA && wa === cWA) return true;
    if (ig && cIG && ig === cIG) return true;
    return false;
  });
  if (existing) {
    // Update nama kalau kosong & order ada nama
    if (!((existing.name || '').trim()) && name) existing.name = name;
    // Lengkapi kontak lain kalau belum ada
    if (!((existing.wa || '').trim()) && wa) existing.wa = wa;
    if (!normalizeIG(existing.ig || '') && ig) existing.ig = ig;
    existing.lastOrderAt = now;
  } else {
    state.customers.push({
      id: uid(), name, wa, ig,
      createdAt: now, lastOrderAt: now
    });
  }
}

function deleteOrder(id) {
  if (!confirm('Hapus pesanan ini?')) return;
  for (const p of state.pos) {
    if (p.orders) p.orders = p.orders.filter(o => o.id !== id);
  }
  saveState(); render();
}

function togglePaid(id) {
  const f = findOrder(id);
  if (f) { f.order.paid = !f.order.paid; saveState(); render(); }
}

function renderCustomerList(list) {

    return `<div class="text-center py-8">

  }

  return `<div class="space-y-2">${list.map(c => {
    const orderCount = countCustomerOrders(c);
    const totalSpent = sumCustomerSpent(c);
    const hasName = !!((c.name || '').trim());
    return `
      <div class="bg-white rounded-xl p-4 shadow">
        <div class="flex justify-between items-start mb-2">
          <div class="min-w-0 flex-1">
            ${hasName ? `<h3 class="font-semibold truncate">${escapeHtml(c.name)}</h3>` : `<h3 class="font-semibold truncate text-gray-400 italic">(tanpa nama)</h3>`}
            <div class="text-xs text-gray-500 space-y-0.5 mt-1">
              ${c.wa ? `<div>📱 ${escapeHtml(c.wa)}</div>` : ''}
              ${c.ig ? `<div>📷 @${escapeHtml(c.ig)}</div>` : ''}
            </div>
          </div>

          </div>
        </div>
        <button onclick="viewCustomer('${c.id}')" class="w-full text-left text-xs text-rose-600 bg-rose-50 rounded p-2">
          ${orderCount} order · Total: ${formatRp(totalSpent)} · Lihat detail →
        </button>
      </div>
    `;
  }).join('')}</div>`;
}

function countCustomerOrders(c) {
  let n = 0;
  for (const po of state.pos) {
    for (const o of (po.orders || [])) {
      if (matchCustomer(o, c)) n++;
    }
  }
  return n;
}
function sumCustomerSpent(c) {
  let total = 0;
  for (const po of state.pos) {
    for (const o of (po.orders || [])) {
      if (matchCustomer(o, c)) total += calcOrderOmzet(o);
    }
  }
  return total;
}
function matchCustomer(order, c) {
  // Match by WA atau IG (mana yang ada di customer)
  const orderWA = (order.customerWA || '').trim();
  const orderIG = normalizeIG(order.customerIG || '');
  const cWA = (c.wa || '').trim();
  const cIG = normalizeIG(c.ig || '');
  if (cWA && orderWA === cWA) return true;
  if (cIG && orderIG === cIG) return true;
  return false;
}

// ============== AUTOCOMPLETE (NAME / WA / IG) ==============
function showCustomerSuggestions(field, val) {
  // field: 'name' | 'wa' | 'ig'
  const dropdownId = field === 'name' ? 'name-suggestions' : field === 'wa' ? 'wa-suggestions' : 'ig-suggestions';
  const dropdown = document.getElementById(dropdownId);
  if (!dropdown) return;
  const raw = (val || '').trim();
  // Normalize query: untuk IG strip @, untuk WA strip non-digit
  let q;
  if (field === 'ig') q = raw.replace(/^@+/, '').toLowerCase();
  else if (field === 'wa') q = raw.replace(/\D/g, '');
  else q = raw.toLowerCase();
  if (!q || state.customers.length === 0) { dropdown.classList.add('hidden'); return; }
  const matches = state.customers.filter(c => {
    if (field === 'name') return (c.name || '').toLowerCase().includes(q);
    if (field === 'wa') return (c.wa || '').replace(/\D/g, '').includes(q);
    if (field === 'ig') return (c.ig || '').toLowerCase().includes(q);
    return false;
  }).slice(0, 5);
  if (matches.length === 0) { dropdown.classList.add('hidden'); return; }
  dropdown.innerHTML = matches.map(c => {
    const cName = (c.name || '').trim();
    const contact = [c.wa ? `📱 ${escapeHtml(c.wa)}` : '', c.ig ? `📷 @${escapeHtml(c.ig)}` : ''].filter(Boolean).join(' · ');
    return `
      <button type="button" onmousedown="event.preventDefault()" onclick="pickAutocomplete('${c.id}')" class="w-full text-left px-3 py-2 hover:bg-rose-50 border-b last:border-b-0">
        <div class="font-medium text-sm">${cName ? escapeHtml(cName) : '<span class="text-gray-400 italic">(tanpa nama)</span>'}</div>
        <div class="text-xs text-gray-500">${contact}</div>
      </button>
    `;
  }).join('');
  dropdown.classList.remove('hidden');
}

function onOrderWAInput(val)   { orderDraft.customerWA = val;   showCustomerSuggestions('wa', val); }

const EXPENSE_CATEGORIES = [

  { id: 'packaging', name: 'Packaging',       emoji: '📦' },
  { id: 'ongkir',    name: 'Ongkir Belanja',  emoji: '🚚' },

  { id: 'lainnya',   name: 'Lain-lain',       emoji: '📝' }
];

}

// View terpilih: 'po:<id>' atau 'umum'. Default = PO terbaru kalo ada, else 'umum'.
function getSelectedView() {
  if (window._selectedView) return window._selectedView;
  const sorted = [...(state.pos || [])].sort((a, b) => new Date(b.date) - new Date(a.date));
  return sorted.length ? `po:${sorted[0].id}` : 'umum';
}

function renderKeuanganTab() {
  const selected = getSelectedView();
  // Semua PO, urut terbaru → terlama
  const sortedPos = [...(state.pos || [])].sort((a, b) => new Date(b.date) - new Date(a.date));
  const isUmum = selected === 'umum';
  const selectedPoId = isUmum ? null : selected.replace(/^po:/, '');
  const selectedPo = selectedPoId ? sortedPos.find(p => p.id === selectedPoId) : null;

  // Jika selected PO ga ketemu (misal udah dihapus), fallback ke umum
  if (!isUmum && !selectedPo) {
    window._selectedView = 'umum';
    return renderKeuanganTab();
  }

  // Hitung untuk view terpilih
  let omzet = 0, lunas = 0, orderCount = 0, paidCount = 0;
  let expenses = [];
  if (selectedPo) {
    for (const o of (selectedPo.orders || [])) {
      const t = calcOrderOmzet(o);
      omzet += t;
      orderCount++;
      if (o.paid) { lunas += t; paidCount++; }
    }
    expenses = (state.expenses || []).filter(e => e.poId === selectedPoId);
  } else {
    // Umum: expenses tanpa poId (atau poId-nya udah ga valid)
    const validPoIds = new Set((state.pos || []).map(p => p.id));
    expenses = (state.expenses || []).filter(e => !e.poId || !validPoIds.has(e.poId));
  }
  const belumLunas = omzet - lunas;
  const pengeluaran = expenses.reduce((s, e) => s + (Number(e.amount) || 0), 0);
  const netProfit = lunas - pengeluaran;
  const margin = lunas > 0 ? Math.round((netProfit / lunas) * 100) : 0;
  const profitColor = netProfit >= 0 ? 'green' : 'red';
  const expensesSorted = [...expenses].sort((a, b) => new Date(b.date) - new Date(a.date));

  // Build dropdown HTML
  const poOptions = sortedPos.map(p => {
    const statusBadge = p.status === 'closed' ? ' (selesai)' : '';
    return `<option value="po:${p.id}" ${selectedPoId === p.id ? 'selected' : ''}>📋 ${escapeHtml(p.name)}${statusBadge}</option>`;
  }).join('');
  const umumOption = `<option value="umum" ${isUmum ? 'selected' : ''}>📌 Biaya Umum (non-PO)</option>`;
  const separator = sortedPos.length > 0 ? `<option disabled>──────────</option>` : '';

  const dropdown = `
    <div class="mb-3">
      <label class="block text-xs text-gray-500 mb-1">📊 Tampilkan</label>
      <select onchange="changeKeuanganView(this.value)" class="w-full border rounded-lg px-3 py-2 bg-white">
        ${poOptions}${separator}${umumOption}
      </select>
    </div>
  `;

  // Header info card (PO date / umum description)
  let headerInfo = '';
  if (selectedPo) {
    const statusEmoji = selectedPo.status === 'closed' ? '🔒' : '🟢';
    headerInfo = `
      <div class="bg-rose-50 rounded-xl p-3 mb-3 text-center">
        <p class="text-xs text-gray-600">${statusEmoji} ${escapeHtml(selectedPo.name)} · ${formatDate(selectedPo.date)}</p>
      </div>
    `;
  } else {
    headerInfo = `
      <div class="bg-amber-50 rounded-xl p-3 mb-3 text-center">
        <p class="text-xs text-amber-800">📌 Biaya umum (yang ga ke-link PO)</p>
        <p class="text-[10px] text-amber-700 mt-1">Misal: beli alat, sewa booth, listrik, dll</p>
      </div>
    `;
  }

  // Summary cards
  let summary;
  if (selectedPo) {
    summary = `
      <div class="space-y-2 mb-4">
        <div class="bg-white rounded-xl p-3 shadow">

function saveExpense(id) {
  const dateStr = document.getElementById('e-date').value;
  const category = document.getElementById('e-category').value;
  const amount = parseInt(document.getElementById('e-amount').value) || 0;
  const notes = document.getElementById('e-notes').value.trim();
  const poId = document.getElementById('e-po').value || '';

  if (!dateStr) { alert('Tanggal wajib diisi'); return; }
  if (!amount || amount <= 0) { alert('Jumlah harus lebih dari 0'); return; }
  // Validate category against known list (defensive)
  if (!EXPENSE_CATEGORIES.find(c => c.id === category)) { alert('Kategori tidak valid'); return; }

  // Store date as ISO at noon local to avoid TZ shenanigans
  const isoDate = new Date(dateStr + 'T12:00:00').toISOString();

  if (!Array.isArray(state.expenses)) state.expenses = [];

  if (id) {
    const idx = state.expenses.findIndex(x => x.id === id);
    if (idx >= 0) {
      state.expenses[idx] = { ...state.expenses[idx], date: isoDate, category, amount, notes, poId };
    }
  } else {
    state.expenses.push({
      id: uid(),
      date: isoDate,
      category, amount, notes, poId,
      createdAt: new Date().toISOString()
    });
  }
  // Auto-switch view ke PO yang dipilih (atau Umum)
  window._selectedView = poId ? `po:${poId}` : 'umum';
  saveState(); closeModal(); render();
}

function deleteExpense(id) {
  if (!confirm('Hapus pengeluaran ini?')) return;
  state.expenses = (state.expenses || []).filter(e => e.id !== id);
  saveState(); render();
}

// ============== MESSAGE GENERATION ==============
function generateWAMessage(order, po) {
  const sub = calcOrderSub(order);
  const total = calcOrderTotal(order);

  const items = (order.items || []).map(it => {
    const m = state.menu.find(m => m.id === it.menuId);
    if (!m) return '';
    return `• ${m.name} — ${it.qty} × ${formatRp(m.price)} = ${formatRp(m.price * it.qty)}`;
  }).filter(Boolean).join('\n');

  const rincianLines = [`Subtotal: ${formatRp(sub)}`];
  if (order.shipping > 0) rincianLines.push(`Ongkir: ${formatRp(order.shipping)}`);
  if (order.discount > 0) rincianLines.push(`Diskon: -${formatRp(order.discount)}`);
  rincianLines.push(`*Total: ${formatRp(total)}*`);
  const rincian = rincianLines.join('\n');

  const catatan = order.notes ? `\n\n📝 Catatan: ${order.notes}` : '';

  const tpl = state.business.template || DEFAULT_TEMPLATE;
  const replacements = {
    '{nama}': order.customerName || '',
    '{po}': po.name || '',
    '{bisnis}': state.business.name || '',
    '{items}': items,
    '{rincian}': rincian,
    '{catatan}': catatan,
    '{pembayaran}': state.business.payment || ''
  };
  let out = tpl;
  for (const k in replacements) {
    out = out.split(k).join(replacements[k]);
  }
  return out;
}

function sendWA(orderId) {
  const f = findOrder(orderId);
  if (!f) return;
  const phone = normalizePhone(f.order.customerWA);
  if (!phone || phone.length < 10) {
    if (!confirm('Nomor WA kosong/tidak valid. Buka WhatsApp tanpa nomor (copy-paste manual)?')) return;
    const msg = encodeURIComponent(generateWAMessage(f.order, f.po));
    window.open(`https://wa.me/?text=${msg}`, '_blank');
    return;
  }
  const msg = encodeURIComponent(generateWAMessage(f.order, f.po));
  window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
}

function resetTemplate() {

  document.getElementById('s-template').value = DEFAULT_TEMPLATE;

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `4ever-crepes-backup-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const imported = JSON.parse(ev.target.result);
      if (!imported.menu || !imported.pos) throw new Error('Format file tidak valid');
      if (!confirm('Yakin restore? Data yang ada sekarang akan diganti.')) return;
      state = Object.assign({}, defaultState, imported);
      saveState(); closeModal(); render();
      alert('Restore berhasil!');
    } catch (err) {
      alert('Gagal restore: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function resetAll() {
  if (!confirm('HAPUS SEMUA DATA (menu, PO, pesanan)? Tidak bisa di-undo!')) return;
  if (!confirm('Yakin banget? Backup dulu kalo perlu.')) return;
  state = JSON.parse(JSON.stringify(defaultState));
  saveState(); closeModal(); render();
}

function translateAuthError(code) {
  const map = {
    'auth/invalid-email': 'Email tidak valid',
    'auth/user-disabled': 'Akun di-disable',

    'auth/wrong-password': 'Password salah',

    'auth/weak-password': 'Password minimal 6 karakter',
    'auth/network-request-failed': 'Gagal konek — cek koneksi internet',
    'auth/too-many-requests': 'Terlalu banyak percobaan, tunggu sebentar'

  return map[code] || code;
}

// ============== AUTH STATE HANDLER ==============
onAuthStateChanged(auth, async (user) => {
  if (unsubData) { unsubData(); unsubData = null; }
  if (!user) {
    currentUser = null;
    isAuthorized = false;
    showScreen('login-screen');
    return;
  }
  currentUser = user;
  showScreen('loading-screen');
  // Check allowlist
  try {
    const snap = await get(ref(db, `allowedUsers/${user.uid}`));
    if (snap.val() !== true) {
      isAuthorized = false;
      document.getElementById('denied-email').textContent = user.email || '-';
      document.getElementById('denied-uid').textContent = user.uid;
      showScreen('denied-screen');
      return;
    }
    isAuthorized = true;
  } catch (e) {
    console.error('Allowlist check failed:', e);
    showAuthError('Gagal cek izin akses. Cek security rules / koneksi.');
    showScreen('login-screen');
    return;
  }

  // Subscribe to /shop — real-time data
  unsubData = onValue(ref(db, 'shop'), (snap) => {
    const data = snap.val();
    state = firebaseToState(data);
    saveLocalCache();
    hideAllScreens();
    render();
  }, (err) => {
    console.error('Data subscription error:', err);
    // Fall back to local cache, masih bisa render
    hideAllScreens();
    render();
  });

  // Subscribe ke /inbox — kiriman robot dari Google Docs.
  // Node terpisah dari /shop supaya ga ketimpa saveState().
  onValue(ref(db, 'inbox'), (snap) => {
    const data = snap.val() || {};
    inbox = Object.keys(data)
      .map(k => ({ id: k, ...data[k] }))
      .filter(x => (x.text || '').trim())
      .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    updateInboxBadge();
    render();
  }, (err) => {
    // Biasanya kejadian kalo security rules buat /inbox belom ditambahin
    console.error('Inbox subscription error:', err);
  });
});

// ============== KOTAK MASUK (dari Google Docs) ==============
// Mesin pembaca: 1 baris teks -> nama customer + daftar item.
// Contoh: "Sarah Gimbap cake 28D 2, Mini Bites 1"
// Prinsip: lebih baik nanya (kasih ⚠️) daripada nebak diem-diem.

function inboxNorm(s) { return (s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); }
function inboxDigits(s) { return ((s || '').match(/\d+/g) || []).join(','); }

// Jarak Levenshtein — ngitung berapa huruf beda antara 2 kata
function inboxLev(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n;
  if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}
function inboxMaxDist(len) { return len <= 5 ? 0 : len <= 10 ? 1 : 2; }

// Cocokin nama menu sebagai EKOR dari teks. Sisa di depan = calon nama customer.
function inboxMatchMenu(text, menu) {
  const nText = inboxNorm(text);
  if (!nText) return null;
  const words = nText.split(' ');
  const cands = [];
  for (const m of menu) {
    const nm = inboxNorm(m.name);
    if (!nm) continue;
    const mWords = nm.split(' ').length;
    if (mWords > words.length) continue;
    const tail = words.slice(words.length - mWords).join(' ');
    // ATURAN KERAS: angka di nama menu harus persis. "28D" ga boleh dikira "20d".
    if (inboxDigits(tail) !== inboxDigits(nm)) continue;
    const d = inboxLev(tail, nm);
    if (d > inboxMaxDist(nm.length)) continue;
    cands.push({ menu: m, dist: d, len: nm.length, leftoverCount: words.length - mWords, leftoverNorm: words.slice(0, words.length - mWords).join(' ') });
  }
  if (!cands.length) return null;
  // Paling mirip menang; kalo seri, nama terpanjang menang ("Peach gum paket" > "Peach gum")
  cands.sort((a, b) => a.dist - b.dist || b.len - a.len);
  const top = cands[0], second = cands[1];
  if (second && second.dist === top.dist && second.len === top.len) {
    return { ...top, ambiguous: [top.menu.name, second.menu.name] };
  }
  return top;
}

// Ambil sisa teks di depan menu dari tulisan ASLI (biar "Sarah" ga jadi "sarah")
function inboxLeftover(origText, hit) {
  const origWords = (origText || '').trim().split(/\s+/).filter(Boolean);
  const normWords = inboxNorm(origText).split(' ').filter(Boolean);
  if (origWords.length === normWords.length) return origWords.slice(0, hit.leftoverCount).join(' ');
  return hit.leftoverNorm;
}

function inboxParseSegment(seg, menu) {
  const raw = (seg || '').trim();
  if (!raw) return null;
  // Penanda jelas " x2" -> pasti jumlah. Wajib ada spasi sebelum x, biar huruf x
  // di tengah kata (mis. "box") ga kebaca sebagai penanda.
  const explicit = raw.match(/^(.*?)\s+[xX*]\s*(\d+)\s*$/);
  if (explicit) {
    const hit = inboxMatchMenu(explicit[1], menu);
    return hit
      ? { menu: hit.menu, qty: parseInt(explicit[2]), leftover: inboxLeftover(explicit[1], hit), dist: hit.dist, ambiguous: hit.ambiguous }
      : { menu: null, qty: parseInt(explicit[2]), rawText: explicit[1].trim(), leftover: '' };
  }
  const opts = [];
  // Tafsiran A: angka polos di belakang = jumlah
  const bare = raw.match(/^(.*?)[\s]+(\d+)\s*$/);
  if (bare) {
    const hit = inboxMatchMenu(bare[1], menu);
    if (hit) opts.push({ menu: hit.menu, qty: parseInt(bare[2]), leftover: inboxLeftover(bare[1], hit), dist: hit.dist, ambiguous: hit.ambiguous });
  }
  // Tafsiran B: angka belakang bagian dari nama menu, jumlah = 1
  const whole = inboxMatchMenu(raw, menu);
  if (whole) opts.push({ menu: whole.menu, qty: 1, leftover: inboxLeftover(raw, whole), dist: whole.dist, ambiguous: whole.ambiguous });

  if (!opts.length) {
    const fallback = bare ? bare[1].trim() : raw;
    return { menu: null, qty: bare ? parseInt(bare[2]) : 1, rawText: fallback, leftover: '' };
  }
  opts.sort((a, b) => a.dist - b.dist);
  if (opts.length > 1 && opts[0].dist === opts[1].dist && opts[0].menu.id !== opts[1].menu.id) {
    return { ...opts[0], ambiguous: [opts[0].menu.name, opts[1].menu.name] };
  }
  return opts[0];
}

function parseInboxLine(line, menu) {
  const clean = (line || '').replace(/\s+/g, ' ').trim();
  if (!clean) return null;
  const items = [], problems = [];
  let customerName = '';
  clean.split(',').forEach((seg, i) => {
    const r = inboxParseSegment(seg, menu);
    if (!r) return;
    if (i === 0) customerName = (r.leftover || '').trim();
    if (r.menu) {
      items.push({ menuId: r.menu.id, menuName: r.menu.name, qty: r.qty });
      if (r.ambiguous) problems.push({ type: 'ambigu', text: seg.trim(), pilihan: r.ambiguous });
      else if (r.dist > 0) problems.push({ type: 'mirip', text: seg.trim(), jadi: r.menu.name });
    } else {
      if (i === 0) {
        const w = (r.rawText || '').split(' ');
        if (w.length > 1) customerName = w[0];
      }
      problems.push({ type: 'ga-ketemu', text: r.rawText || seg.trim() });
    }
  });
  return { rawLine: clean, customerName, items, problems };
}

// ---------- tampilan ----------
function updateInboxBadge() {
  const el = document.getElementById('inbox-badge');
  if (!el) return;
  if (inbox.length > 0) {
    el.textContent = inbox.length;
    el.classList.remove('hidden');
  } else {
    el.classList.add('hidden');
  }
}

function renderInboxTab() {
  if (inbox.length === 0) {
    return `
      <div class="text-center py-12 px-4">
        <div class="text-4xl mb-3">📥</div>
        <p class="text-gray-500 font-medium">Belum ada pesanan masuk</p>
        <p class="text-xs text-gray-400 mt-2">Pesanan yang lu tulis di Google Docs bakal nongol di sini otomatis.</p>
      </div>`;
  }
  const activePos = getActivePos();
  if (activePos.length === 0) {
    return `
      <div class="p-4">
        <div class="bg-amber-50 border border-amber-300 rounded-lg p-3 text-sm text-amber-800">
          ⚠️ Ada <b>${inbox.length}</b> pesanan masuk, tapi belom ada PO aktif.
          Bikin PO dulu di tab 📋 PO, baru pesanannya bisa diterima.
        </div>
      </div>`;
  }

  const cards = inbox.map(entry => {
    const p = parseInboxLine(entry.text, state.menu);
    const hasProblem = !p || p.problems.length > 0;
    const itemRows = (p?.items || []).map(it => {
      const m = state.menu.find(mm => mm.id === it.menuId);
      const price = m ? m.price * it.qty : 0;
      return `<div class="flex justify-between text-sm py-0.5">
        <span class="text-green-700">✓ ${escapeHtml(it.menuName)} × ${it.qty}</span>
        <span class="text-gray-600 whitespace-nowrap">${formatRp(price)}</span>
      </div>`;
    }).join('');

    const problemRows = (p?.problems || []).map(pr => {
      if (pr.type === 'ga-ketemu') return `<div class="bg-amber-100 border border-dashed border-amber-400 rounded p-2 text-xs text-amber-900 mt-1">⚠️ <b>"${escapeHtml(pr.text)}"</b> ga ketemu di menu. Terima dulu, terus betulin di form.</div>`;
      if (pr.type === 'ambigu') return `<div class="bg-amber-100 border border-dashed border-amber-400 rounded p-2 text-xs text-amber-900 mt-1">⚠️ <b>"${escapeHtml(pr.text)}"</b> bisa berarti <b>${escapeHtml(pr.pilihan.join('</b> atau <b>'))}</b>. Cek pas di form ya.</div>`;
      return `<div class="bg-amber-50 border border-dashed border-amber-300 rounded p-2 text-xs text-amber-800 mt-1">⚠️ Ditebak jadi <b>${escapeHtml(pr.jadi)}</b> (tulisannya rada beda). Cek bener ga.</div>`;
    }).join('');

    const subtotal = (p?.items || []).reduce((sum, it) => {
      const m = state.menu.find(mm => mm.id === it.menuId);
      return sum + (m ? m.price * it.qty : 0);
    }, 0);

    const poOptions = activePos.map(po => `<option value="${po.id}">${escapeHtml(po.name)}</option>`).join('');
    const canAccept = p && p.items.length > 0;

    return `
      <div class="bg-white rounded-xl p-3 mb-3 border ${hasProblem ? 'border-amber-300 bg-amber-50' : ''}">
        <div class="font-bold">${p?.customerName ? escapeHtml(p.customerName) : '<span class="text-gray-400 italic">(nama ga kebaca)</span>'}</div>
        <div class="text-xs text-gray-400 mb-2 italic">"${escapeHtml(entry.text)}"</div>
        ${itemRows}
        ${problemRows}
        ${canAccept ? `<div class="flex justify-between text-sm font-bold text-rose-500 border-t border-dashed mt-2 pt-2">
          <span>Subtotal</span><span>${formatRp(subtotal)}</span>
        </div>` : ''}
        <div class="mt-3">
          <label class="block text-xs text-gray-500 mb-1">Masukin ke PO</label>
          <select id="inbox-po-${entry.id}" class="w-full border rounded-lg px-2 py-1.5 text-sm bg-white">${poOptions}</select>
        </div>
        <div class="flex gap-2 mt-3">
          <button onclick="terimaInbox('${entry.id}')" class="flex-1 bg-rose-500 text-white rounded-lg py-2 text-sm font-bold">✓ Terima</button>
          <button onclick="buangInbox('${entry.id}')" class="px-4 bg-gray-100 text-gray-600 rounded-lg py-2 text-sm font-bold">Buang</button>
        </div>
      </div>`;
  }).join('');

  return `<div class="p-3">
    <p class="text-xs text-gray-500 mb-3">${inbox.length} pesanan nunggu dicek. Pilih PO-nya, terus Terima.</p>
    ${cards}
  </div>`;
}

// Terima: buka form pesanan yang BIASA, tapi udah keisi nama + menunya.
// Sengaja pake form lama biar semua yang udah jalan bener (autocomplete, auto-save customer,
// itungan total) tetep kepake — makin dikit kode baru, makin dikit peluang bug.
function terimaInbox(id) {
  const entry = inbox.find(x => x.id === id);
  if (!entry) return;
  const sel = document.getElementById(`inbox-po-${id}`);
  const poId = sel ? sel.value : null;
  if (!poId) { alert('Pilih PO dulu'); return; }
  if (state.menu.length === 0) { alert('Tambah menu dulu di tab Menu ya!'); return; }

  const p = parseInboxLine(entry.text, state.menu);
  const items = (p?.items || []).map(it => ({ menuId: it.menuId, qty: it.qty }));
  if (items.length === 0) items.push({ menuId: state.menu[0].id, qty: 1 });

  selectedPoId = poId;
  pendingInboxId = id;
  editingOrderId = null;
  window.orderDraft = orderDraft = {
    id: uid(),
    customerName: p?.customerName || '',
    customerWA: '',
    customerIG: '',
    items,
    shipping: 0,
    discount: 0,
    paid: false,
    notes: ''
  };
  showOrderModal();
}

function buangInbox(id) {
  const entry = inbox.find(x => x.id === id);
  if (!entry) return;
  if (!confirm(`Buang pesanan ini?\n\n"${entry.text}"\n\nCatetan di Google Docs ga ikut kehapus.`)) return;
  removeInboxEntry(id);
}

function removeInboxEntry(id) {
  // Hapus lokal dulu biar tampilan langsung responsif
  inbox = inbox.filter(x => x.id !== id);
  updateInboxBadge();
  render();
  if (isAuthorized && currentUser) {
    set(ref(db, `inbox/${id}`), null).catch(err => console.error('Gagal hapus inbox:', err));
  }
}
